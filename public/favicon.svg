<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 2026 Next-Gen Mesh Gradient Canvas -->
    <radialGradient id="meshGlow1" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="1" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="meshGlow2" cx="85%" cy="85%" r="70%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="1" />
      <stop offset="45%" stop-color="#0EA5E9" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshGlow3" cx="80%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#9333EA" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Ambient Surface Gradient -->
    <linearGradient id="deepCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Iris Aura Gradient -->
    <linearGradient id="irisRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Frosted Glass Specular Gradient -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <!-- Focus Bolt Gradient -->
    <linearGradient id="energyCore" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Volumetric Shadows & Glow Filters -->
    <filter id="ultraDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#030712" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.25" />
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#38BDF8" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="6" stdDeviation="24" flood-color="#818CF8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base 2026 Continuous Superellipse (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#deepCanvas)" filter="url(#ultraDepth)" />
  
  <!-- Multi-layered Mesh Nebula inside container -->
  <g clip-path="url(#squircleClip)">
    <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#meshGlow1)" style="mix-blend-mode: screen;" />
    <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#meshGlow2)" style="mix-blend-mode: screen;" />
    <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#meshGlow3)" style="mix-blend-mode: screen;" />
    
    <!-- Ultra-subtle Micro-dot Grid Pattern -->
    <circle cx="120" cy="120" r="1.5" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="200" cy="120" r="1.5" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="280" cy="120" r="1.5" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="360" cy="120" r="1.5" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="120" cy="200" r="1.5" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="360" cy="200" r="1.5" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="120" cy="280" r="1.5" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="360" cy="280" r="1.5" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="120" cy="360" r="1.5" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="200" cy="360" r="1.5" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="280" cy="360" r="1.5" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="360" cy="360" r="1.5" fill="#FFFFFF" fill-opacity="0.2" />
  </g>

  <!-- Precision Specular Glass Border Frame -->
  <rect x="25" y="25" width="462" height="462" rx="123" fill="none" stroke="url(#glassSheen)" stroke-width="2.5" />
  
  <!-- Outer Chrono Iris Orbit Ring (Focus & Flow Dial) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="28" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#irisRing)" stroke-width="28" stroke-dasharray="942" stroke-dashoffset="235" stroke-linecap="round" filter="url(#coreGlow)" />

  <!-- Inner Liquid Crystal Center Disc -->
  <circle cx="256" cy="256" r="106" fill="#0F172A" fill-opacity="0.65" stroke="url(#glassSheen)" stroke-width="2" />

  <!-- Central Hyper-Fluid Task Glyph: Harmonic Checkmark + Focus Pulse -->
  <!-- Dynamic Checkmark Arc -->
  <path d="M192 260 L234 302 L320 206" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dynamic Radiant Spark Accent (Top Right Focus Node) -->
  <path d="M344 140 Q358 160 380 168 Q358 176 344 196 Q330 176 308 168 Q330 160 344 140 Z" fill="url(#energyCore)" filter="url(#coreGlow)" />
  <circle cx="344" cy="168" r="4" fill="#FFFFFF" />

  <!-- Floating Ambient Photon Particle -->
  <circle cx="168" cy="340" r="6" fill="#38BDF8" fill-opacity="0.8" filter="url(#coreGlow)" />
</svg>
